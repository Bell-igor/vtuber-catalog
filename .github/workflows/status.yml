name: Обновление статуса стрима

# Раз в 5 минут проверяет Twitch, Telegram и Discord и обновляет status.json.
# Если ничего не изменилось — коммита не будет.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update-status.mjs"
      - ".github/workflows/status.yml"

permissions:
  contents: write

concurrency:
  group: status-update
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статус
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node .github/scripts/update-status.mjs

      - name: Сжать картинки с Twitch в webp
        continue-on-error: true
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages Pillow || python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 .github/scripts/make-webp.py

      - name: Закоммитить, если что-то изменилось
        run: |
          git config user.name "status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          ASSETS="status.json assets/img/avatar-twitch.png assets/img/banner-twitch.png assets/img/avatar-twitch.webp assets/img/banner-twitch.webp"
          CHANGED="$(git status --porcelain -- $ASSETS)"
          echo "изменения: [$CHANGED]"
          if [ -z "$CHANGED" ]; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git add -- $ASSETS
          git commit -m "Автообновление статуса стрима"
          if git push; then
            echo "запушено"
          else
            # параллельный запуск успел закоммитить раньше — не страшно,
            # данные всё равно обновляются каждые 5 минут
            echo "push отклонён (гонка с другим запуском) — подтягиваю версию из репозитория"
            git fetch origin main
            git reset --hard origin/main
          fi
